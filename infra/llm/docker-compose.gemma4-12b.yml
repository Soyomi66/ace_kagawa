# Gemma 4 12B on vLLM, in place of the Swallow-8B container (same port 8011 and GPU0 budget).
# Chosen in docs/audits/llm-candidates-2026-10-28.md. bf16 does not fit 0.55 x 48 GB with a
# 16384-token context (0.36 GiB KV left), so the weights are quantized to FP8 at load time.
# vLLM 0.9.2 cannot load Gemma 4; v0.32.0-cu129 is the build the comparison ran on. Its
# torchcodec is built for CUDA 13 and stops the server, so `up` builds a local image without it
# (Dockerfile.vllm-cu129).
# The served name must contain "gemma-4": infra/tokkio/tokkio_llm.py matches it to send the
# evaluated sampling with thinking off.
# Switching from Swallow and back: infra/tokkio/README.md (ローカル LLM を Gemma 4 12B（FP8）に切り替える).
# Own project name: the Swallow container belongs to project "llm" (this directory's name), and
# sharing it would list Swallow as an orphan that `up --remove-orphans` deletes.
name: ace-llm-gemma4
services:
  vllm-gemma4-12b:
    build:
      context: .
      dockerfile: Dockerfile.vllm-cu129
    image: ${VLLM_IMAGE:-ace/vllm-openai:v0.32.0-cu129-no-torchcodec}
    container_name: ${VLLM_CONTAINER_NAME:-ace-vllm-gemma4-12b}
    restart: unless-stopped
    runtime: nvidia
    shm_size: "16gb"
    ipc: host
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GPU_DEVICES:-0}
      OMP_NUM_THREADS: "8"
    volumes:
      - /data/ACE/models:/data/ACE/models
    command:
      - --model
      - /data/ACE/models/gemma-4-12B-it
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_PORT:-8011}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-gemma-4-12b-it}
      - --quantization
      - fp8
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.55}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      # Text only: no memory reserved for the image/video/audio encoders.
      - --limit-mm-per-prompt
      - '{"image":0,"video":0,"audio":0}'
